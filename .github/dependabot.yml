version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
    ignore:
      - dependency-name: "typescript"
        # svelte-check 4.x peers require typescript ^5 || ^6; TS 7 has no
        # stable programmatic API for svelte-check yet.
        versions: [">= 7"]
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
