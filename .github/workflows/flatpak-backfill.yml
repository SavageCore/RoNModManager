name: Flatpak Backfill

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish the Flatpak bundle for (e.g. v0.0.12)"
        required: true
        type: string

jobs:
  flatpak-backfill:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install git-cliff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          gh release download --repo orhun/git-cliff \
            --pattern 'git-cliff-*-x86_64-unknown-linux-musl.tar.gz' \
            --dir "$tmp"
          tar xz -C "$tmp" -f "$tmp"/git-cliff-*-x86_64-unknown-linux-musl.tar.gz
          sudo install -m 755 "$(find "$tmp" -name git-cliff -type f)" /usr/local/bin/git-cliff
      - name: Update AppStream releases
        run: make update-appstream
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Flatpak runtimes
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/flatpak
          key: flatpak-runtimes-release-${{ hashFiles('packaging/flatpak/uk.savagecore.ronmodmanager.yml') }}
          restore-keys: |
            flatpak-runtimes-release-
            flatpak-runtimes-

      - name: Cache Flatpak builder state
        uses: actions/cache@v6
        with:
          path: |
            .flatpak-builder/
          key: flatpak-builder-release-${{ hashFiles('packaging/flatpak/uk.savagecore.ronmodmanager.yml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-builder-release-${{ hashFiles('packaging/flatpak/uk.savagecore.ronmodmanager.yml') }}-
            flatpak-builder-${{ hashFiles('packaging/flatpak/uk.savagecore.ronmodmanager.yml') }}-
            flatpak-builder-release-
            flatpak-builder-

      - run: |
          cd src-tauri
          mkdir -p .cargo vendor
          cargo vendor vendor
          cat <<EOF > .cargo/config.toml
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "vendor"
          EOF
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream-compose
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.node24//25.08
          # org.freedesktop.Sdk.Extension.rust-stable//25.08 HEAD is currently broken upstream
          # (missing objects -> HTTP 404 on pull); fall back to last known good publish.
          GOOD_COMMIT=385427f6dabe6d297cced114496cfa6e38bb93fe4c6fbee7fdabb97dd141d29a
          if flatpak install --user -y flathub org.freedesktop.Sdk.Extension.rust-stable//25.08; then
            exit 0
          fi
          echo "::warning::Flathub pull failed; installing rust-stable//25.08 from known good commit ${GOOD_COMMIT}"
          sudo apt-get install -y ostree
          ostree --repo=rust-stable-repo init --mode=archive-z2
          ostree --repo=rust-stable-repo remote add --no-gpg-verify origin https://dl.flathub.org/repo/
          ostree --repo=rust-stable-repo pull origin "${GOOD_COMMIT}"
          ostree --repo=rust-stable-repo refs --create=runtime/org.freedesktop.Sdk.Extension.rust-stable/x86_64/25.08 "${GOOD_COMMIT}"
          flatpak build-bundle --runtime rust-stable-repo rust-stable.flatpak org.freedesktop.Sdk.Extension.rust-stable 25.08
          flatpak install --user -y --bundle rust-stable.flatpak
      - name: Import Flatpak GPG key
        run: |
          if [ -z "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY secret is not set"
            exit 1
          fi
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | base64 -d | gpg --import
      - name: Build Flatpak
        run: |
          FLATPAK_GPG_KEY=$(gpg --list-keys --keyid-format=long --with-colons | awk -F: '/^fpr/{print $10; exit}')
          # Source downloads (launchpad.net, Flathub CDN) are flaky; retry the
          # builder so a transient 502/404 does not fail the whole run.
          attempt=1
          max_attempts=3
          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "Flatpak build attempt $attempt/$max_attempts"
            if flatpak-builder --force-clean --user \
              --gpg-sign=$FLATPAK_GPG_KEY \
              --repo=flatpak-repo build-dir packaging/flatpak/uk.savagecore.ronmodmanager.yml; then
              break
            fi
            echo "::warning::flatpak-builder failed on attempt $attempt/$max_attempts"
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_attempts" ]; then
              echo "::error::flatpak-builder failed after $max_attempts attempts"
              exit 1
            fi
            sleep 30
          done
          flatpak build-bundle \
            --gpg-sign=$FLATPAK_GPG_KEY \
            --gpg-keys=packaging/flatpak/ronmodmanager-flatpak.gpg \
            flatpak-repo ronmodmanager.flatpak uk.savagecore.ronmodmanager master
          cp packaging/flatpak/ronmodmanager-flatpak.gpg flatpak-repo/
          touch flatpak-repo/.nojekyll
      - name: Upload Flatpak bundle to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: ronmodmanager.flatpak
      - name: Deploy OSTree repo to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: flatpak-repo
          clean: true
      - name: Build userscript
        run: |
          cd userscript
          npm ci
          npm run build
          cd ..
      - name: Upload userscript to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: userscript/dist/*.user.js
