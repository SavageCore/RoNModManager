name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm config set script-shell bash
      - run: npm ci
      - name: Check commit subjects are conventional
        # git-cliff drops anything else from metainfo.xml and the release notes.
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch reports an all-zero "before" sha, and a force-push can
          # report a "before" that no longer exists (Renovate rebases its
          # branches). In both cases fall back to the tip commit; the PR run
          # still covers the whole range.
          if [ "${FROM//0/}" = "" ] || ! git cat-file -e "${FROM}^{commit}" 2>/dev/null; then
            FROM="$TO^"
          fi
          npx commitlint --from "$FROM" --to "$TO"

  lint-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm config set script-shell bash
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1
      - run: npm run test:unit:coverage
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          verbose: true

  build-userscript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: userscript/package-lock.json
      # userscript/ is not a root workspace, so its own install is needed.
      # The release workflow runs this exact build; failing here is the only
      # way to catch it before a release ships without the userscript.
      - run: |
          cd userscript
          npm ci
          npm run build

  lint-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: lint-backend

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          version: 1.0

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  coverage-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: coverage-backend

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          version: 1.0

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Ratchet gate on total line coverage. The number includes the inline
      # #[cfg(test)] bodies llvm-cov instruments, so it runs well above the
      # production-only figure (measured ~62% total / ~46% production in Sep
      # 2026). Bump it whenever coverage grows.
      - name: Generate backend lcov
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lib --lcov --output-path lcov-backend.info --fail-under-lines 55 --remap-path-prefix
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-backend.info
          flags: backend
          fail_ci_if_error: false
          verbose: true
