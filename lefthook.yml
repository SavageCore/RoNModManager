# Git hooks managed by lefthook. Install with `lefthook install`
# (runs automatically via `npm install`).

pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      run: npx oxfmt {staged_files}
      glob:
        - "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,svelte}"
        - "*.{css,json,md,yml,yaml}"
      stage_fixed: true

    - name: oxlint
      run: npx oxlint --fix {staged_files}
      glob:
        - "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,svelte}"
      stage_fixed: true

    - name: eslint package.json
      run: npx eslint {staged_files}
      glob:
        - "**/package.json"
      stage_fixed: true

    - name: cargo fmt
      run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      glob:
        - "src-tauri/**"

    - name: cargo clippy (lib + bins)
      run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --bins -- -D warnings
      glob:
        - "src-tauri/**"

commit-msg:
  jobs:
    - name: conventional commit subject
      run: npx commitlint --edit {1}

pre-push:
  jobs:
    - name: cargo clippy (all targets)
      run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

    - name: cargo test
      run: cargo test --manifest-path src-tauri/Cargo.toml

    - name: svelte-check
      run: npm run check

    - name: unit tests with coverage
      run: npm run test:unit:coverage
